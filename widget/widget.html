<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<div id="lane">
  <svg id="ramps" aria-hidden="true"></svg>
  <div id="banner"><div class="bName"></div><div class="bSub"></div><div class="bMsg"></div></div>
  <div id="rider">
    <div class="jump">
      <div class="spin">
        <div class="rat">
          <svg viewBox="0 0 160 120" aria-hidden="true">
            <!-- tail -->
            <path d="M40 80 C18 84 6 70 12 54 C16 44 26 44 24 52" fill="none" stroke="#ff9ac8" stroke-width="5" stroke-linecap="round"/>
            <!-- back leg -->
            <path d="M58 88 L50 104 L44 118" fill="none" stroke="var(--rat)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- body (hoodie) -->
            <path d="M40 78 C38 54 58 40 82 42 C100 44 108 58 104 74 C100 92 80 98 62 96 C50 95 41 89 40 78 Z" fill="var(--a)"/>
            <path d="M52 60 C62 54 76 54 86 58" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3" stroke-linecap="round"/>
            <!-- front leg -->
            <path d="M88 88 L100 104 L110 118" fill="none" stroke="var(--rat)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- arms -->
            <path class="armB" d="M66 58 L50 70 L38 66" fill="none" stroke="var(--rat)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="armF" d="M92 58 L110 66 L124 60" fill="none" stroke="var(--rat)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- head -->
            <circle cx="104" cy="34" r="19" fill="var(--rat)"/>
            <path d="M118 26 L146 40 L118 46 Z" fill="var(--rat)" stroke="var(--rat)" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="148" cy="40" r="4.5" fill="#ff9ac8"/>
            <path d="M140 46 L156 50 M140 44 L156 42" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
            <circle cx="96" cy="16" r="10" fill="var(--rat)"/>
            <circle cx="96" cy="16" r="5.5" fill="#ff9ac8"/>
            <circle cx="118" cy="31" r="3.4" fill="#120a1c"/>
            <circle cx="119.2" cy="29.8" r="1.1" fill="#fff"/>
            <!-- backwards cap -->
            <path d="M86 26 C88 10 112 8 120 22 Z" fill="var(--b)"/>
            <rect x="74" y="20" width="18" height="6" rx="3" fill="var(--b)" transform="rotate(14 83 23)"/>
          </svg>
        </div>
        <div class="board">
          <svg viewBox="0 0 160 30" aria-hidden="true">
            <rect x="34" y="11" width="10" height="6" fill="#bfc3cc"/>
            <rect x="116" y="11" width="10" height="6" fill="#bfc3cc"/>
            <circle cx="39" cy="22" r="7" fill="var(--b)"/><circle cx="39" cy="22" r="2.5" fill="#120a1c"/>
            <circle cx="121" cy="22" r="7" fill="var(--b)"/><circle cx="121" cy="22" r="2.5" fill="#120a1c"/>
            <path d="M6 2 Q10 10 20 10 L140 10 Q150 10 154 2 L156 4 Q152 14 140 14 L20 14 Q8 14 4 4 Z" fill="var(--a)"/>
            <path d="M8 3 Q12 9 20 9 L140 9 Q148 9 152 3" fill="none" stroke="#1a1a1a" stroke-width="3"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
